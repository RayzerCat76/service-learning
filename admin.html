<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Learning Admin</title>
    <style>
        :root {
            --navy: #123e8f;
            --navy-deep: #082d70;
            --blue: #1b4da0;
            --brand-red: #e54555;
            --gold: var(--brand-red);
            --gold-pale: #fff0f2;
            --canvas: #f1f2f4;
            --line: #d9dee7;
            --ink: #172e5c;
            --muted: #68738a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: var(--canvas);
            padding: 0 20px 32px;
            margin: auto;
            color: var(--ink);
        }
        .site-header {
            max-width: 1200px;
            min-height: 88px;
            margin: 0 auto 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            background: #fff;
            border-bottom: 4px solid var(--navy);
            padding: 14px 24px;
        }
        .brand-lockup { display: flex; align-items: center; gap: 13px; }
        .brand-mark {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            border-radius: 50%;
            background: repeating-radial-gradient(ellipse at 50% 70%, transparent 0 5px, #17479a 6px 9px, transparent 10px 13px), linear-gradient(145deg, var(--brand-red) 0 21%, #fff 22% 38%, #17479a 39% 100%);
            border: 1px solid #d8dfe9;
        }
        .brand-name { color: var(--navy); font-size: 15px; font-weight: 800; letter-spacing: .035em; line-height: 1.2; text-transform: uppercase; }
        .brand-subtitle { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; margin-top: 4px; text-transform: uppercase; }
        .portal-label { color: var(--navy); font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
        .box {
            max-width: 1200px;
            background: white;
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 0;
            box-shadow: 0 8px 24px rgba(12, 42, 97, 0.06);
            margin: 0 auto 20px;
        }
        h2, h3 {
            margin-bottom: 16px;
            color: var(--navy);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 12px;
        }
        h2 { font-family: Arial, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -.025em; }
        h3 { font-family: Arial, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -.015em; }
        .form-group {
            margin-bottom: 14px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdcad7;
            border-radius: 4px;
            font-size: 14px;
            color: var(--ink);
            background: #fff;
        }
        input:focus, textarea:focus, select:focus {
            outline: 3px solid rgba(183,154,99,.28);
            outline-offset: 1px;
            border-color: var(--gold);
        }
        button {
            padding: 10px 16px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            margin-right: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .035em;
            text-transform: uppercase;
            transition: background .18s ease, transform .18s ease;
        }
        button:hover { transform: translateY(-1px); }
        .btn-blue { background: var(--navy); color: white; }
        .btn-red  { background: #a1403c; color: white; }
        .btn-green{ background: var(--gold); color: var(--navy-deep); }
        .btn-orange{ background: var(--gold-pale); color: var(--navy); border: 1px solid var(--brand-red); }
        .btn-purple{ background: var(--blue); color: white; }
        .hidden { display: none; }
        .flex {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .color-box {
            width: 44px;
            height: 44px;
            border-radius: 4px;
            border: 2px solid var(--gold);
            cursor: pointer;
        }
        .color-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="color"] { display: none; }
        .preview {
            position: relative;
            width: 100%;
            height: 420px;
            background: #fbfcfd;
            border: 1px solid var(--line);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 16px;
        }
        #stage, #newsStage {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .block {
            position: absolute;
            padding: 12px;
            background: white;
            border: 2px solid var(--navy);
            cursor: move;
            font-size: 14px;
            line-height: 1.5;
            min-width: 100px;
            min-height: 60px;
        }
        .news-block {
            border-color: var(--gold);
        }
        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 16px;
            height: 16px;
            background: var(--navy);
        }
        .news-block .resize-handle {
            background: var(--gold);
        }
        .tab-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            padding: 8px 14px;
            border: 1px solid #c6d1dc;
            background: #fff;
            border-radius: 999px;
            cursor: pointer;
            color: var(--navy);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .03em;
            text-transform: uppercase;
        }
        .tab-btn.active {
            background: var(--navy);
            color: white;
            border-color: var(--navy);
        }
        .news-item-select {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid var(--line);
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .news-item-card {
            padding: 8px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
        }
        .news-item-card:hover {
            background: var(--gold-pale);
        }
        .news-item-card.active {
            background: #e7eef5;
            border-left: 4px solid var(--gold);
        }
        .image-preview-small {
            max-width: 120px;
            max-height: 80px;
            object-fit: cover;
            margin: 4px;
            border-radius: 4px;
            border:1px solid var(--line);
        }
        #loginPanel { max-width: 460px; margin: 9vh auto; border-top: 5px solid var(--brand-red); }
        #loginPanel::before { content: "YCIS SHANGHAI"; display: block; margin-bottom: 12px; color: var(--brand-red); font-size: 12px; font-weight: 800; letter-spacing: .16em; }
        #loginPanel h2::after { content: "Service Learning · Staff access"; display: block; margin-top: 8px; color: var(--muted); font-family: Arial, sans-serif; font-size: 14px; font-weight: 400; border: 0; }
        #loginMessage { min-height: 22px; margin: 12px 0 0; color: #b42318; font-size: 14px; }
        #dashboard > .box:first-child { border-top: 5px solid var(--brand-red); }
        @media (max-width: 620px) {
            body { padding: 0 12px 24px; }
            .site-header { margin-bottom: 20px; padding: 12px; min-height: 74px; }
            .portal-label { display: none; }
            .brand-name { font-size: 13px; }
            .box { padding: 20px; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
            <div class="brand-name">Yew Chung International School of Shanghai</div>
            <div class="brand-subtitle">Service Learning</div>
        </div>
    </div>
    <div class="portal-label">Staff Portal</div>
</header>

<div class="box" id="loginPanel">
    <h2>Admin Login</h2>
    <div class="form-group">
        <input type="text" id="username" placeholder="Username" autocomplete="username">
    </div>
    <div class="form-group">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    </div>
    <button class="btn-blue" onclick="login()">Login</button>
    <p id="loginMessage" role="alert" aria-live="polite"></p>
</div>

<div id="dashboard" class="hidden">
    <div class="box">
        <h2>Admin Panel
            <button class="btn-red" style="float:right" onclick="logout()">Logout</button>
        </h2>
        <div class="tab-row">
            <div class="tab-btn active" data-tab="programLayout">Program Layout</div>
            <div class="tab-btn" data-tab="newsManager">News Manager</div>
        </div>
    </div>

    <div class="tab-content" id="programLayout">
        <div class="box">
            <h3>Programs</h3>
            <div class="form-group">
                <input type="text" id="newProgName" placeholder="Program Name">
                <button class="btn-green" onclick="createProgram()">Create Program</button>
            </div>
            <select id="programSelect" onchange="selectProgram(this.value)"></select>
            <button class="btn-red" onclick="deleteProgram()">Delete Program</button>
        </div>

        <div class="box">
            <h3>Edit Block</h3>
            <div class="form-group">
                <input type="text" id="blockTitle" placeholder="Title">
            </div>
            <div class="form-group">
                <textarea id="blockContent" rows="3" placeholder="Content"></textarea>
            </div>
            <div class="flex">
                <div>
                    <label>Background</label>
                    <div class="color-row">
                        <div id="bgBox" class="color-box"></div>
                        <input type="color" id="bgColor" value="#ffffff">
                    </div>
                </div>
                <div>
                    <label>Text Color</label>
                    <div class="color-row">
                        <div id="textColorBox" class="color-box"></div>
                        <input type="color" id="textColor" value="#000000">
                    </div>
                </div>
            </div>
            <button class="btn-blue" onclick="updateBlock()">Save Block</button>
        </div>

        <div class="box">
            <h3>Layout Preview</h3>
            <button class="btn-orange" onclick="generateTemplate()">Generate Two-Box Template</button>
            <button class="btn-blue" onclick="saveLayout()">Save Layout</button>
            <div class="preview">
                <div id="stage"></div>
            </div>
        </div>
    </div>

    <div class="tab-content hidden" id="newsManager">
        <div class="box">
            <h3>News Manager</h3>
            <button class="btn-green" onclick="createNewNews()">Create New News Article</button>
            <div class="news-item-select" id="newsItemList"></div>
        </div>

        <div class="box">
            <h3>Edit News Metadata</h3>
            <div class="form-group">
                <label>News Title</label>
                <input type="text" id="newsTitle" placeholder="Enter news title">
            </div>
            <div class="form-group">
                <label>Short Overview</label>
                <textarea id="newsOverview" rows="2" placeholder="Short summary preview"></textarea>
            </div>
            <div class="form-group">
                <label>Full Content</label>
                <textarea id="newsFullContent" rows="4" placeholder="Main news content"></textarea>
            </div>
            <button class="btn-blue" onclick="saveNewsMeta()">Save Title / Overview / Content</button>
            <button class="btn-red" onclick="deleteSelectedNews()">Delete This News</button>
        </div>

        <div class="box">
            <h3>News Images</h3>
            <div class="form-group">
                <input type="text" id="newsImageUrl" placeholder="Paste image URL here">
            </div>
            <button class="btn-purple" onclick="addNewsImage()">Add Image to News</button>
            <div id="newsImagePreviewRow"></div>
        </div>

        <div class="box">
            <h3>News Page Visual Editor</h3>
            <button class="btn-purple" onclick="addNewsTextBox()">Add Movable Text Box</button>
            <button class="btn-blue" onclick="saveNewsLayout()">Save News Page Layout</button>
            <div class="preview">
                <div id="newsStage"></div>
            </div>
        </div>
    </div>
</div>

<script>
const API_URL = "/api/programs";
let currentUser = null;
let programs = [], selectedProgram;
let blocks = [], selectedBlock;

let allNews = [];
let selectedNewsId = null;
let newsLayoutBlocks = [];

const bgColor = document.getElementById("bgColor");
const textColor = document.getElementById("textColor");
const bgBox = document.getElementById("bgBox");
const textColorBox = document.getElementById("textColorBox");

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.add('hidden'));
        document.getElementById(tab).classList.remove('hidden');
    };
});

bgColor.addEventListener("input", syncColors);
textColor.addEventListener("input", syncColors);
function syncColors(){
    bgBox.style.backgroundColor = bgColor.value;
    textColorBox.style.backgroundColor = textColor.value;
}

async function login(){
    const message = document.getElementById("loginMessage");
    message.textContent = "Signing in…";
    try {
        const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: document.getElementById("username").value, password: document.getElementById("password").value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unable to sign in");
        currentUser = data.user.username;
        document.getElementById("loginPanel").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        message.textContent = "";
        loadPrograms();
        syncColors();
    } catch (error) {
        message.textContent = error.message;
    }
}
async function logout(){
    await fetch("/api/auth/logout", { method: "POST" });
    location.reload();
}

async function loadPrograms(){
    try{
        const res = await fetch(API_URL, { cache: "no-store" });
        programs = await res.json();
        const sel = document.getElementById("programSelect");
        sel.innerHTML = "";
        programs.forEach(p=>{
            const opt = document.createElement("option");
            opt.value = p.id;
            opt.innerText = p.name;
            sel.appendChild(opt);
        });
        if(programs.length) selectProgram(programs[0].id);
    } catch(e) { console.error(e); }
}

function selectProgram(id){
    selectedProgram = programs.find(p => p.id == id);
    selectedNewsId = null;

    try {
        blocks = Array.isArray(selectedProgram.blocks) ? selectedProgram.blocks : JSON.parse(selectedProgram.blocks || "[]");
    } catch(e) { blocks = []; }

    try {
        allNews = Array.isArray(selectedProgram.news) ? selectedProgram.news : JSON.parse(selectedProgram.news || "[]");
    } catch(e) { allNews = []; }

    renderBlocks();
    renderNewsList();
}

async function createProgram(){
    const name = document.getElementById("newProgName").value.trim() || "New Program";
    await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, created_by: currentUser, blocks: [], news: [] })
    });
    loadPrograms();
}

async function deleteProgram(){
    if (!selectedProgram || !confirm("Delete program?")) return;
    await fetch(`${API_URL}/${selectedProgram.id}`, { method: "DELETE" });
    loadPrograms();
}

// ✅ Core Fix: Use PATCH instead of PUT
async function saveProgramToDB(){
    try {
        const res = await fetch(`${API_URL}/${selectedProgram.id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ blocks: blocks, news: allNews })
        });
        if (!res.ok) throw new Error("Request failed");
        return true;
    } catch (e) {
        alert("❌ Failed to save to database. The API endpoint is not working.");
        console.error(e);
        return false;
    }
}

async function updateBlock(){
    if (!selectedBlock) return;
    selectedBlock.title = document.getElementById("blockTitle").value;
    selectedBlock.content = document.getElementById("blockContent").value;
    selectedBlock.bg = bgColor.value;
    selectedBlock.text = textColor.value;
    renderBlocks();
    const success = await saveProgramToDB();
    if (success) alert("✅ Block saved to database");
}

async function saveLayout(){
    blocks.forEach(b => {
        const el = document.querySelector(`[data-id="${b.id}"]`);
        if (el) {
            b.x = parseFloat(el.style.left);
            b.y = parseFloat(el.style.top);
            b.w = parseFloat(el.style.width);
            b.h = parseFloat(el.style.height);
        }
    });
    const success = await saveProgramToDB();
    if (success) alert("✅ Layout saved to database");
    renderBlocks();
}

function renderBlocks(){
    const stage = document.getElementById("stage");
    stage.innerHTML = "";
    if (!Array.isArray(blocks)) return;
    blocks.forEach(block => {
        const el = document.createElement("div");
        el.className = "block";
        el.dataset.id = block.id;
        el.style.left = block.x + "%";
        el.style.top = block.y + "%";
        el.style.width = block.w + "%";
        el.style.height = block.h + "%";
        el.style.backgroundColor = block.bg;
        el.style.color = block.text;
        el.style.border = block.border;
        el.innerHTML = `<strong>${block.title}</strong><br>${block.content}`;
        const rh = document.createElement("div");
        rh.className = "resize-handle";
        el.appendChild(rh);
        el.onclick = () => {
            selectedBlock = block;
            document.getElementById("blockTitle").value = block.title;
            document.getElementById("blockContent").value = block.content;
            bgColor.value = block.bg;
            textColor.value = block.text;
            syncColors();
        };
        stage.appendChild(el);
    });
}

function generateTemplate(){
    blocks = [
        { id:"info", title:"Basic Information", content:"", x:2, y:5, w:46, h:90, bg:"#fff", text:"#000", border:"2px solid #ccc" },
        { id:"contact", title:"Contact Information", content:"", x:52, y:5, w:46, h:90, bg:"#fff", text:"#000", border:"2px solid #ccc" }
    ];
    renderBlocks();
}

// News Functions
function renderNewsList(){
    const wrap = document.getElementById("newsItemList");
    wrap.innerHTML = "";
    allNews.forEach(item => {
        const card = document.createElement("div");
        card.className = "news-item-card" + (item.id === selectedNewsId ? " active" : "");
        card.innerText = item.title || "Untitled News";
        card.onclick = () => selectNewsItem(item.id);
        wrap.appendChild(card);
    });
    clearNewsEditorFields();
}

function createNewNews(){
    const newNews = {
        id: "news_" + Date.now(),
        title: "New News Article",
        overview: "",
        content: "",
        imageUrls: [],
        layoutBlocks: []
    };
    allNews.push(newNews);
    selectedNewsId = newNews.id;
    saveProgramToDB().then(() => {
        renderNewsList();
        loadSelectedNewsData();
    });
}

function selectNewsItem(newsId){
    selectedNewsId = newsId;
    renderNewsList();
    loadSelectedNewsData();
}

function loadSelectedNewsData(){
    const news = allNews.find(n => n.id === selectedNewsId);
    if (!news) return;
    document.getElementById("newsTitle").value = news.title;
    document.getElementById("newsOverview").value = news.overview;
    document.getElementById("newsFullContent").value = news.content;
    newsLayoutBlocks = news.layoutBlocks || [];
    renderNewsImages();
    renderNewsLayout();
}

function clearNewsEditorFields(){
    document.getElementById("newsTitle").value = "";
    document.getElementById("newsOverview").value = "";
    document.getElementById("newsFullContent").value = "";
    document.getElementById("newsImageUrl").value = "";
    document.getElementById("newsImagePreviewRow").innerHTML = "";
    document.getElementById("newsStage").innerHTML = "";
    newsLayoutBlocks = [];
}

async function saveNewsMeta(){
    const news = allNews.find(n => n.id === selectedNewsId);
    if (!news) return;
    news.title = document.getElementById("newsTitle").value;
    news.overview = document.getElementById("newsOverview").value;
    news.content = document.getElementById("newsFullContent").value;
    const success = await saveProgramToDB();
    if (success) {
        alert("✅ News metadata saved to database");
        renderNewsList();
    }
}

async function deleteSelectedNews(){
    if (!selectedNewsId || !confirm("Delete this news article?")) return;
    allNews = allNews.filter(n => n.id !== selectedNewsId);
    selectedNewsId = null;
    const success = await saveProgramToDB();
    if (success) renderNewsList();
}

function addNewsImage(){
    const url = document.getElementById("newsImageUrl").value.trim();
    if (!url) return;
    const news = allNews.find(n => n.id === selectedNewsId);
    if (!news) return;
    if (!news.imageUrls) news.imageUrls = [];
    news.imageUrls.push(url);
    document.getElementById("newsImageUrl").value = "";
    renderNewsImages();
    saveProgramToDB();
}

function renderNewsImages(){
    const row = document.getElementById("newsImagePreviewRow");
    row.innerHTML = "";
    const news = allNews.find(n => n.id === selectedNewsId);
    if (!news || !news.imageUrls) return;
    news.imageUrls.forEach((img, idx) => {
        const wrap = document.createElement("div");
        wrap.style.display = "inline-block";
        const imgEl = document.createElement("img");
        imgEl.src = img;
        imgEl.className = "image-preview-small";
        const delBtn = document.createElement("button");
        delBtn.className = "btn-red";
        delBtn.style.fontSize = "12px";
        delBtn.innerText = "Remove";
        delBtn.onclick = () => {
            news.imageUrls.splice(idx, 1);
            renderNewsImages();
            saveProgramToDB();
        };
        wrap.appendChild(imgEl);
        wrap.appendChild(delBtn);
        row.appendChild(wrap);
    });
}

function addNewsTextBox(){
    if (!selectedNewsId) {
        alert("Select or create a news article first");
        return;
    }
    const newBox = {
        id: "news_txt_" + Date.now(),
        type: "text",
        text: "New Text Box",
        x: 10, y: 10, w: 30, h: 20,
        bg: "#ffffff",
        color: "#222",
        border: "2px solid #9b59b6"
    };
    newsLayoutBlocks.push(newBox);
    renderNewsLayout();
}

function renderNewsLayout(){
    const stage = document.getElementById("newsStage");
    stage.innerHTML = "";
    newsLayoutBlocks.forEach(block => {
        const el = document.createElement("div");
        el.className = "block news-block";
        el.dataset.id = block.id;
        el.style.left = block.x + "%";
        el.style.top = block.y + "%";
        el.style.width = block.w + "%";
        el.style.height = block.h + "%";
        el.style.background = block.bg;
        el.style.color = block.color;
        el.style.border = block.border;
        el.contentEditable = true;
        el.innerText = block.text;
        stage.appendChild(el);
    });
}

async function saveNewsLayout(){
    const news = allNews.find(n => n.id === selectedNewsId);
    if (!news) return;
    newsLayoutBlocks.forEach(b => {
        const el = document.querySelector(`#newsStage [data-id="${b.id}"]`);
        if (el) {
            b.x = parseFloat(el.style.left);
            b.y = parseFloat(el.style.top);
            b.w = parseFloat(el.style.width);
            b.h = parseFloat(el.style.height);
            b.text = el.innerText;
        }
    });
    news.layoutBlocks = newsLayoutBlocks;
    const success = await saveProgramToDB();
    if (success) alert("✅ News page layout saved to database");
}
</script>
</body>
</html>
