<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Service Learning News · YCIS</title>
<style>
:root{--navy:#123e8f;--navy-deep:#082d70;--red:#e54555;--ink:#172e5c;--muted:#69758b;--canvas:#f1f2f4;--line:#d9dee7;--shadow:0 12px 32px rgba(12,42,97,.08)}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.58}a{color:inherit}.site-header{background:white;border-bottom:4px solid var(--navy)}.nav{width:min(1120px,calc(100% - 36px));min-height:78px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{text-decoration:none}.brand strong{display:block;color:var(--navy);font-size:13px;text-transform:uppercase;letter-spacing:.04em}.brand span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.back{color:var(--navy);font-size:13px;font-weight:800;text-decoration:none}.wrap{width:min(980px,calc(100% - 36px));margin:auto}.article-head{padding:54px 0 30px}.eyebrow{margin:0 0 9px;color:var(--red);font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.13em}.article-head h1{margin:0;color:var(--navy);font-size:clamp(36px,5.5vw,60px);line-height:1.03;letter-spacing:-.045em}.article-head .overview{max-width:800px;margin:16px 0 0;color:var(--muted);font-size:18px}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px;color:#7c8798;font-size:13px}.meta a{color:var(--navy);font-weight:800;text-decoration:none}.article-shell{position:relative;overflow:hidden;margin-bottom:70px;border:1px solid var(--line);border-radius:16px;background:#fff;background-size:cover;background-position:center;box-shadow:var(--shadow)}.article-shell.has-bg:before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.91)}.article-inner{position:relative;z-index:1;padding:30px}.full-copy{white-space:pre-wrap;margin:0 0 28px;font-size:16px}.empty{padding:23px;border:1px dashed #b9c4d3;border-radius:10px;color:var(--muted);background:#fafbfd}.footer{padding:32px;text-align:center;background:var(--navy-deep);color:#dce5f4;font-size:13px}@media(max-width:680px){.article-head{padding-top:38px}.article-inner{padding:16px}.nav{align-items:flex-start;padding:17px 0;flex-direction:column}.back{font-size:12px}}
</style><script src="/renderer.js"></script>
</head>
<body>
<header class="site-header"><nav class="nav"><a class="brand" href="/"><strong>Yew Chung International School of Shanghai</strong><span>Service Learning</span></a><a id="projectBack" class="back" href="/">← Back to homepage</a></nav></header>
<main class="wrap"><header class="article-head"><p id="projectName" class="eyebrow">Service Learning news</p><h1 id="newsTitle">Loading story…</h1><p id="newsOverview" class="overview"></p><div class="meta"><time id="newsDate"></time><span aria-hidden="true">·</span><a id="projectLink" href="/">Return to project tab</a></div></header><article id="articleShell" class="article-shell"><div id="articleInner" class="article-inner"><div class="empty">Loading story…</div></div></article></main>
<footer class="footer">YCIS Shanghai · Service Learning</footer>
<script>
const API='/api/programs';const $=id=>document.getElementById(id);
function query(name){return new URLSearchParams(location.search).get(name)}
function normalizeNews(raw,index=0){if(typeof raw==='string')return{id:'legacy_'+index,title:'Project update',overview:raw,content:raw,publishedAt:new Date(0).toISOString(),published:true,backgroundImage:'',layoutBlocks:[]};return{id:raw.id||'news_'+index,title:raw.title||'Project update',overview:raw.overview||'',content:raw.content||'',publishedAt:raw.publishedAt||new Date(0).toISOString(),published:raw.published!==false,backgroundImage:raw.backgroundImage||'',layoutBlocks:Array.isArray(raw.layoutBlocks)?raw.layoutBlocks:[]}}
function formatDate(value){const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}
async function load(){try{const res=await fetch(API,{cache:'no-store'});if(!res.ok)throw new Error('Could not load Service Learning news');const programs=await res.json();const program=programs.find(p=>String(p.id)===String(query('program')));if(!program)throw new Error('This project could not be found.');const news=(Array.isArray(program.news)?program.news:[]).map(normalizeNews).find(n=>String(n.id)===String(query('id'))&&n.published);if(!news)throw new Error('This news story could not be found or is not published.');document.title=`${news.title} · ${program.name}`;$('projectName').textContent=program.name;$('newsTitle').textContent=news.title;$('newsOverview').textContent=news.overview||'';$('newsDate').textContent=formatDate(news.publishedAt);$('newsDate').dateTime=news.publishedAt;const homeUrl=`/?program=${encodeURIComponent(program.id)}#projects`;$('projectLink').href=homeUrl;$('projectLink').textContent=`Return to ${program.name}`;$('projectBack').href=homeUrl;$('projectBack').textContent='← Back to homepage';const shell=$('articleShell');if(news.backgroundImage){shell.classList.add('has-bg');shell.style.backgroundImage=`url("${news.backgroundImage.replace(/"/g,'%22')}")`}const inner=$('articleInner');inner.innerHTML='';if(news.content){const p=document.createElement('p');p.className='full-copy';p.textContent=news.content;inner.appendChild(p)}if(news.layoutBlocks.length){const layout=document.createElement('div');SLRenderer.renderLayout(layout,news.layoutBlocks);inner.appendChild(layout)}if(!news.content&&!news.layoutBlocks.length)inner.innerHTML='<div class="empty">This story has no content yet.</div>'}catch(e){$('newsTitle').textContent='News unavailable';$('newsOverview').textContent='';$('articleInner').innerHTML=`<div class="empty">${e.message}</div>`}}
load();
</script>
</body></html>
