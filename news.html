<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Service Learning News · YCIS</title>
<style>
:root{--navy:#123e8f;--navy-deep:#082d70;--red:#e54555;--ink:#172e5c;--muted:#69758b;--line:#dfe3e9;--soft:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.62}a{color:inherit}.site-header{background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(16px)}.nav{width:min(1120px,calc(100% - 44px));min-height:72px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{text-decoration:none}.brand strong{display:block;color:var(--navy);font-size:13px;text-transform:uppercase;letter-spacing:.04em}.brand span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.back{color:var(--navy);font-size:13px;font-weight:800;text-decoration:none}.back:hover{color:var(--red)}.wrap{width:min(980px,calc(100% - 44px));margin:auto}.article-head{padding:72px 0 42px}.eyebrow{margin:0 0 12px;color:var(--red);font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.14em}.article-head h1{margin:0;color:var(--navy);font-size:clamp(42px,6vw,68px);line-height:1.02;letter-spacing:-.05em}.article-head .overview{max-width:820px;margin:20px 0 0;color:var(--muted);font-size:19px}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px;color:#7c8798;font-size:13px}.meta a{color:var(--navy);font-weight:800;text-decoration:none}.meta a:hover{color:var(--red)}.article-shell{position:relative;margin-bottom:90px;border-top:1px solid var(--line);background-size:cover;background-position:center}.article-shell.has-bg{margin-top:8px;min-height:300px}.article-shell.has-bg:before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.9)}.article-inner{position:relative;z-index:1;padding:38px 0 0}.article-shell.has-bg .article-inner{padding:52px 38px}.full-copy{white-space:pre-wrap;margin:0 0 38px;font-size:17px}.empty{padding:28px 0;border-top:1px solid var(--line);color:var(--muted)}.footer{padding:32px;text-align:center;background:var(--navy-deep);color:#dce5f4;font-size:13px}@media(max-width:680px){.article-head{padding-top:48px}.article-inner{padding-top:28px}.article-shell.has-bg .article-inner{padding:34px 18px}.nav{align-items:flex-start;padding:16px 0;flex-direction:column}.back{font-size:12px}}
</style><script src="/renderer.js"></script>
</head>
<body>
<header class="site-header"><nav class="nav"><a class="brand" href="/"><strong>Yew Chung International School of Shanghai</strong><span>Service Learning</span></a><a id="projectBack" class="back" href="/">← Back to homepage</a></nav></header>
<main class="wrap"><header class="article-head"><p id="projectName" class="eyebrow">Service Learning news</p><h1 id="newsTitle">Loading story…</h1><p id="newsOverview" class="overview"></p><div class="meta"><time id="newsDate"></time><span aria-hidden="true">·</span><a id="projectLink" href="/">Return to programme</a></div></header><article id="articleShell" class="article-shell"><div id="articleInner" class="article-inner"><div class="empty">Loading story…</div></div></article></main>
<footer class="footer">YCIS Shanghai · Service Learning</footer>
<script>
const API='/api/programs';const $=id=>document.getElementById(id);
function query(name){return new URLSearchParams(location.search).get(name)}
function normalizeNews(raw,index=0){if(typeof raw==='string')return{id:'legacy_'+index,title:'Programme update',overview:raw,content:raw,publishedAt:new Date(0).toISOString(),published:true,backgroundImage:'',layoutBlocks:[]};return{id:raw.id||'news_'+index,title:raw.title||'Programme update',overview:raw.overview||'',content:raw.content||'',publishedAt:raw.publishedAt||new Date(0).toISOString(),published:raw.published!==false,backgroundImage:raw.backgroundImage||'',layoutBlocks:Array.isArray(raw.layoutBlocks)?raw.layoutBlocks:[]}}
function formatDate(value){const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'})}
async function load(){try{const res=await fetch(API,{cache:'no-store'});if(!res.ok)throw new Error('Could not load Service Learning news');const programs=await res.json();const program=programs.find(p=>String(p.id)===String(query('program')));if(!program)throw new Error('This programme could not be found.');const news=(Array.isArray(program.news)?program.news:[]).map(normalizeNews).find(n=>String(n.id)===String(query('id'))&&n.published);if(!news)throw new Error('This news story could not be found or is not published.');document.title=`${news.title} · ${program.name}`;$('projectName').textContent=program.name;$('newsTitle').textContent=news.title;$('newsOverview').textContent=news.overview||'';$('newsDate').textContent=formatDate(news.publishedAt);$('newsDate').dateTime=news.publishedAt;const homeUrl=`/?program=${encodeURIComponent(program.id)}#programmes`;$('projectLink').href=homeUrl;$('projectLink').textContent=`Return to ${program.name}`;$('projectBack').href=homeUrl;$('projectBack').textContent='← Back to homepage';const shell=$('articleShell');if(news.backgroundImage){shell.classList.add('has-bg');shell.style.backgroundImage=`url("${news.backgroundImage.replace(/"/g,'%22')}")`}const inner=$('articleInner');inner.innerHTML='';if(news.content){const p=document.createElement('p');p.className='full-copy';p.textContent=news.content;inner.appendChild(p)}if(news.layoutBlocks.length){const layout=document.createElement('div');SLRenderer.renderLayout(layout,news.layoutBlocks);inner.appendChild(layout)}if(!news.content&&!news.layoutBlocks.length)inner.innerHTML='<div class="empty">This story has no content yet.</div>'}catch(e){$('newsTitle').textContent='News unavailable';$('newsOverview').textContent='';$('articleInner').innerHTML=`<div class="empty">${e.message}</div>`}}
load();
</script>
</body></html>
